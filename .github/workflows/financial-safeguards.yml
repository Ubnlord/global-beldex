name: Financial safeguards

on:
  pull_request:
    branches: [main, feat/bdx-native-accounting, fix/bdx-wallet-regression-gates, fix/preserve-legacy-usd-display]
  push:
    branches: [main, fix/preserve-legacy-usd-display]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Static financial safeguard contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run static security contracts
        run: npm run test:security

  local-database:
    name: Reproducible local Supabase security regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - run: npm ci

      - name: Prepare database from repository migrations
        run: |
          set -euo pipefail
          mkdir -p .security-test
          cd .security-test
          supabase init --force
          cd ..
          node scripts/prepare-local-security-db.mjs

      - name: Start isolated Supabase
        working-directory: .security-test
        # The regression suite needs Postgres, Auth, PostgREST, and the local
        # Edge Runtime. Skip optional UI/observability containers to reduce
        # image pulls and avoid transient public ECR throttling on hosted CI.
        run: supabase start --exclude studio,logflare,vector,analytics,mailpit,imgproxy

      - name: Apply repository migrations
        working-directory: .security-test
        run: supabase db reset

      - name: Reconstruct production schema drift and apply forward compatibility migration
        working-directory: .security-test
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f ../scripts/production-schema-compatibility-fixture.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f ../supabase/migrations/20261012150000_bdx_referral_compatibility_forward.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f ../supabase/migrations/20261012150000_bdx_referral_compatibility_forward.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "DO \$assert\$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='user_profile'
                AND column_name='referral_earnings_bdx') THEN
              RAISE EXCEPTION 'forward migration did not restore referral_earnings_bdx';
            END IF;
            IF position('referral_earnings_bdx' in pg_get_functiondef('public.credit_referral_for_deposit(uuid)'::regprocedure)) = 0
              OR position('BDX' in pg_get_functiondef('public.credit_referral_for_deposit(uuid)'::regprocedure)) = 0 THEN
              RAISE EXCEPTION 'forward migration did not install BDX referral routine';
            END IF;
            IF has_function_privilege('anon','public.credit_referral_for_deposit(uuid)','EXECUTE')
              OR NOT has_function_privilege('authenticated','public.credit_referral_for_deposit(uuid)','EXECUTE')
              OR NOT has_function_privilege('service_role','public.credit_referral_for_deposit(uuid)','EXECUTE') THEN
              RAISE EXCEPTION 'forward migration installed unexpected referral RPC grants';
            END IF;
          END \$assert\$;"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f ../scripts/synthetic-accounting-reconciliation.sql

      - name: Run pgTAP safeguards against reconstructed production schema
        working-directory: .security-test
        run: supabase test db

      - name: Verify investment-plan limit migration preserves financial records
        working-directory: .security-test
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          DB_URL="$DB_URL" node ../scripts/investment-plan-migration-compatibility.test.mjs

      - name: Run concurrent-session conversion and rollback regression
        working-directory: .security-test
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          DB_URL="$DB_URL" node ../scripts/bdx-conversion-concurrency.test.mjs

      - name: Verify daily-rate catalog correction preserves historical snapshots
        working-directory: .security-test
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f ../scripts/test-daily-rate-catalog-only.sql

      - name: Validate read-only legacy inventory on isolated database
        if: ${{ hashFiles('scripts/bdx-legacy-inventory.readonly.sql') != '' }}
        working-directory: .security-test
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f ../scripts/bdx-legacy-inventory.readonly.sql

      - name: Start swap Edge Function locally
        working-directory: .security-test
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          cat > functions.env <<EOF
          SUPABASE_URL=$API_URL
          SUPABASE_ANON_KEY=$ANON_KEY
          SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY
          EOF
          nohup supabase functions serve swap-assets --env-file functions.env > functions.log 2>&1 &
          echo $! > functions.pid
          sleep 8
          cat functions.log || true

      - name: Run full JavaScript security regression
        run: |
          set -euo pipefail
          eval "$(cd .security-test && supabase status -o env)"
          SUPABASE_TEST_URL="$API_URL" SUPABASE_TEST_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" SUPABASE_TEST_PUBLISHABLE_KEY="$ANON_KEY" node --test scripts/security-regression.test.mjs

      - name: Stop isolated Supabase
        if: always()
        working-directory: .security-test
        run: supabase stop

      - name: Upload local Supabase logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: security-test-logs
          path: |
            .security-test/functions.log
            .security-test/supabase/.temp/*.log
          if-no-files-found: ignore
