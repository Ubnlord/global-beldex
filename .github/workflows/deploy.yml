name: Deploy Global Beldex to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Prepare GitHub Pages static site
        run: |
          set -e

          if [ -d "./dist/client" ]; then
            OUTPUT_DIR="./dist/client"
          elif [ -d "./.output/public" ]; then
            OUTPUT_DIR="./.output/public"
          else
            echo "ERROR: Could not find the static build output."
            find . -path "./node_modules" -prune -o -type f -name "index.html" -print
            exit 1
          fi

          echo "Using static output: $OUTPUT_DIR"
          rm -rf ./pages-site
          mkdir -p ./pages-site
          cp -R "$OUTPUT_DIR"/. ./pages-site/

          # GitHub Pages needs an index.html at the site root.
          # TanStack Start SPA mode may emit its shell as _shell.html.
          if [ ! -f "./pages-site/index.html" ] && [ -f "./pages-site/_shell.html" ]; then
            cp ./pages-site/_shell.html ./pages-site/index.html
          fi

          # Final safety check: never deploy an artifact without a root index.
          if [ ! -f "./pages-site/index.html" ]; then
            echo "ERROR: No root index.html or _shell.html was generated."
            echo "Top-level build output:"
            find "$OUTPUT_DIR" -maxdepth 2 -type f -print | sort | head -100
            exit 1
          fi

          # GitHub Pages returns 404.html for paths that were not emitted as
          # static files. Keep the SPA shell for normal client-side routes,
          # but make referral URLs case-insensitive: /ref/Mrkenmk,
          # /ref/mrkenmk, etc. all become /register?ref=Mrkenmk.
          cp ./pages-site/index.html ./pages-site/404.html
          python3 - <<'PY'
          from pathlib import Path

          path = Path("./pages-site/404.html")
          html = path.read_text(encoding="utf-8")
          marker = "</head>"
          script = """<script>
          (function () {
            var match = window.location.pathname.match(/^\\/ref\\/([^/]+)\\/?$/i);
            if (match) {
              window.location.replace("/register?ref=" + encodeURIComponent(match[1]));
            }
          })();
          </script>"""
          if marker not in html:
              raise SystemExit("ERROR: index.html has no </head> marker; cannot create 404 referral handler.")
          path.write_text(html.replace(marker, script + marker, 1), encoding="utf-8")
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-site

      - id: deployment
        uses: actions/deploy-pages@v4
