name: Production API security regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify dedicated test-database secrets are configured
        run: |
          test -n "${SUPABASE_TEST_SERVICE_ROLE_KEY}" || { echo "::error::SUPABASE_SERVICE_ROLE_KEY secret is missing"; exit 1; }
          test -n "${SUPABASE_TEST_PUBLISHABLE_KEY}" || { echo "::error::SUPABASE_PUBLISHABLE_KEY secret is missing"; exit 1; }
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Run production API security regression
        run: npm run test:security
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          NODE_OPTIONS: --unhandled-rejections=strict
