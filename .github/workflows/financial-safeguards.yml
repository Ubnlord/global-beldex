name: Financial safeguards

on:
  pull_request:
    branches: [main, feat/bdx-native-accounting, fix/bdx-wallet-regression-gates]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only the newest safeguard run for a ref should consume a local database
# stack; overlapping Supabase containers were triggering registry throttling.
concurrency:
  group: financial-safeguards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static financial safeguard contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run static security contracts
        run: npm run test:security

  local-database:
    name: Reproducible local Supabase security regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          # Pin the CLI to avoid a GitHub API lookup for `latest`, which can
          # fail under unauthenticated release API rate limits.
          version: 2.53.6

      - name: Authenticate container pulls to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Limit concurrent Docker image downloads
        # Supabase starts several services together. Limiting daemon-level
        # downloads reduces bursts against GHCR without skipping any services
        # required by the regression suite or disabling tests.
        run: |
          set -euo pipefail
          sudo python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('/etc/docker/daemon.json')
          config = json.loads(path.read_text()) if path.exists() else {}
          config['max-concurrent-downloads'] = 2
          path.write_text(json.dumps(config) + '\\n')
          PY
          sudo systemctl restart docker
          docker info --format '{{.RegistryConfig.IndexConfigs}}' >/dev/null

      - run: npm ci

      - name: Prepare database from repository migrations
        run: |
          set -euo pipefail
          mkdir -p .security-test
          cd .security-test
          supabase init --force
          cd ..
          node scripts/prepare-local-security-db.mjs

      - name: Start isolated Supabase
        working-directory: .security-test
        # The regression suite needs Postgres, Auth, and PostgREST. Skip
        # optional UI/observability containers. Container registries can
        # temporarily throttle image pulls, so retry startup with backoff.
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if supabase start --exclude studio,logflare,vector,analytics,mailpit,imgproxy; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Supabase container startup failed (attempt $attempt/3); cleaning up and retrying after backoff."
              supabase stop || true
              sleep $((attempt * 30))
            fi
          done
          echo "Supabase could not start after 3 attempts; database migration and regression checks did not run."
          exit 1

      - name: Apply repository migrations
        working-directory: .security-test
        run: |
          set -euo pipefail
          mkdir -p ../security-test-evidence
          supabase db reset 2>&1 | tee ../security-test-evidence/migration-replay.log

      - name: Run pgTAP safeguards
        working-directory: .security-test
        run: |
          set -euo pipefail
          supabase test db 2>&1 | tee ../security-test-evidence/pgtap-results.log

      - name: Run full JavaScript security regression
        run: |
          set -euo pipefail
          eval "$(cd .security-test && supabase status -o env)"
          SUPABASE_TEST_URL="$API_URL" \
          SUPABASE_TEST_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          SUPABASE_TEST_PUBLISHABLE_KEY="$ANON_KEY" \
          node --test scripts/security-regression.test.mjs 2>&1 | tee security-test-evidence/javascript-regression.log

      - name: Upload isolated database evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-production-lineage-test-evidence
          path: |
            security-test-evidence/*.log
            .security-test/supabase/.temp/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop isolated Supabase
        if: always()
        run: |
          if [ -d .security-test ]; then
            cd .security-test
            supabase stop
          else
            echo 'No isolated Supabase project was created; nothing to stop.'
          fi
