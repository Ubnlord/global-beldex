name: Financial safeguards

on:
  pull_request:
    branches: [main, feat/bdx-native-accounting, fix/bdx-wallet-regression-gates]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Static financial safeguard contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run static security contracts
        run: npm run test:security

  local-database:
    name: Reproducible local Supabase security regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: npm ci

      - name: Prepare database from repository migrations
        run: |
          set -euo pipefail
          mkdir -p .security-test
          cd .security-test
          supabase init --force
          cd ..
          node scripts/prepare-local-security-db.mjs

      - name: Start isolated Supabase
        working-directory: .security-test
        # The regression suite needs Postgres, Auth, and PostgREST. Skip
        # optional UI/observability containers to reduce
        # image pulls and avoid transient public ECR throttling on hosted CI.
        run: supabase start --exclude studio,logflare,vector,analytics,mailpit,imgproxy

      - name: Apply repository migrations
        working-directory: .security-test
        run: |
          set -euo pipefail
          mkdir -p ../security-test-evidence
          supabase db reset 2>&1 | tee ../security-test-evidence/migration-replay.log

      - name: Run pgTAP safeguards
        working-directory: .security-test
        run: |
          set -euo pipefail
          supabase test db 2>&1 | tee ../security-test-evidence/pgtap-results.log

      - name: Run full JavaScript security regression
        run: |
          set -euo pipefail
          eval "$(cd .security-test && supabase status -o env)"
          SUPABASE_TEST_URL="$API_URL" \
          SUPABASE_TEST_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          SUPABASE_TEST_PUBLISHABLE_KEY="$ANON_KEY" \
          node --test scripts/security-regression.test.mjs 2>&1 | tee security-test-evidence/javascript-regression.log

      - name: Upload isolated database evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-production-lineage-test-evidence
          path: |
            security-test-evidence/*.log
            .security-test/supabase/.temp/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop isolated Supabase
        if: always()
        working-directory: .security-test
        run: supabase stop
